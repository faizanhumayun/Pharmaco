; Lets the back office upload an old POS database (tens of megabytes) when
; moving a business in. PHP's own defaults are 2M and 8M, and these two cannot
; be changed from inside the application — only where PHP starts.
;
; Local server:
;   PHP_INI_SCAN_DIR=":$(pwd)/config/php" php artisan serve
;
; On a real server, put the same two lines in its php.ini (or the PHP-FPM
; pool), and raise the web server's own body limit to match
; (nginx: client_max_body_size 210m).
upload_max_filesize = 200M
post_max_size = 210M
